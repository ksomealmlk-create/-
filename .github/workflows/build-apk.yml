name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and locate project
        run: |
          mkdir -p proj
          unzip -q LightMaze3D.zip -d proj
          SETTINGS=$(find proj -name settings.gradle -not -path "*/node_modules/*" | head -1)
          echo "settings found: $SETTINGS"
          find proj -maxdepth 3 | head -40
          if [ -z "$SETTINGS" ]; then echo "NO settings.gradle INSIDE THE ZIP"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          cp ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk out/

      - uses: actions/upload-artifact@v4
        with:
          name: LightMaze3D-APK
          path: out/*.apk

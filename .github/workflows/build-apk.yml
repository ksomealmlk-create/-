name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and locate project
        run: |
          mkdir -p proj
          n=0
          for z in $(find . -maxdepth 2 -iname '*.zip' -not -path './proj/*'); do
            n=$((n+1))
            mkdir -p "proj/z$n"
            unzip -q -o "$z" -d "proj/z$n" || true
          done
          S=$(find proj -name settings.gradle | head -n 1)
          if [ -z "$S" ]; then
            echo "NO settings.gradle FOUND"
            find proj -maxdepth 4 | head -50
            exit 1
          fi
          DIR=$(dirname "$S")
          echo "Project dir: $DIR"
          echo "PROJ_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Fix timestamps
        run: find "$PROJ_DIR" -exec touch {} + || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find "$PROJ_DIR" -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: LightMaze3D-APK
          path: out/*.apk
